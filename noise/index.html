<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound On / Romania Off? — Noise Pollution in Romania</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* SOUND ON / ROMANIA OFF? — a 5-minute live audiovisual story about noise pollution in Romania
   VOICE  a signal that starts as interference and ends as silence
   LOOK   black broadcast space, signal-red + white ridge-line waveforms, glitch; resolves into calm cyan, then paper-white silence
   TYPE   Unbounded (signal / shouting) · IBM Plex Mono (data, labels) · Instrument Serif italic (the human voice)
   SOUND  real recordings from Wikimedia Commons (credited in Sources), with a synthesized fallback for each layer */
:root { --bg:#08080b; --ink:#f1efe9; --dim:rgba(241,239,233,.55); --red:#ff3a2e; --amb:#ffb000; --cy:#39e5d0; --line:rgba(241,239,233,.16);
  --f-sig:'Unbounded','Arial Black',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace; --f-voice:'Instrument Serif',Georgia,serif; }
* { box-sizing:border-box; min-width:0; }
html,body { margin:0; height:100%; background:#000; color:var(--ink); font-family:var(--f-mono); overflow:hidden; }
button { font-family:inherit; }
#stage { position:absolute; left:50%; top:50%; width:1920px; height:1080px; transform-origin:center; overflow:hidden; background:var(--bg); color:var(--ink); transition:background 3s ease, color 3s ease; }
#viz { position:absolute; inset:0; width:1920px; height:1080px; transition:opacity 1s; }
#stage::after { content:''; position:absolute; inset:0; pointer-events:none; z-index:85; background:repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); mix-blend-mode:overlay; }
#screen { position:absolute; inset:0; z-index:5; }
.pg { position:absolute; inset:0; }
@keyframes up { from { opacity:0; transform:translateY(40px); } }
@keyframes fade { from { opacity:0; } }
@keyframes blink { 50% { opacity:.15; } }
.in { animation:up .8s cubic-bezier(.2,.8,.2,1) both; }
.d1 { animation-delay:.15s; } .d2 { animation-delay:.3s; } .d3 { animation-delay:.45s; } .d4 { animation-delay:.6s; } .d5 { animation-delay:.75s; }
.lbl { font-family:var(--f-mono); font-size:20px; letter-spacing:.22em; text-transform:uppercase; color:var(--dim); }
.lbl b { color:var(--red); font-weight:600; }
.voice { font-family:var(--f-voice); font-style:italic; font-weight:400; }
.src { font-size:16px; line-height:1.45; color:var(--dim); letter-spacing:.02em; }
.src i { font-style:normal; color:var(--ink); }

/* glitch headings */
.gl { position:relative; display:inline-block; }
.gl::before, .gl::after { content:attr(data-t); position:absolute; left:0; top:0; width:100%; pointer-events:none; mix-blend-mode:screen; }
.gl::before { color:var(--red); animation:g1 2.6s infinite steps(1); }
.gl::after { color:var(--cy); animation:g2 1.9s infinite steps(1); }
@keyframes g1 { 0%,100% { transform:translate(-5px,0); clip-path:inset(0 0 70% 0); } 20% { transform:translate(6px,-2px); clip-path:inset(40% 0 30% 0); } 40% { transform:translate(-3px,1px); clip-path:inset(75% 0 2% 0); } 60% { transform:translate(0); clip-path:inset(100% 0 0 0); } }
@keyframes g2 { 0%,100% { transform:translate(5px,0); clip-path:inset(60% 0 0 0); } 30% { transform:translate(-6px,2px); clip-path:inset(10% 0 70% 0); } 55% { transform:translate(0); clip-path:inset(100% 0 0 0); } 80% { transform:translate(3px,0); clip-path:inset(30% 0 45% 0); } }
.calm .gl::before, .calm .gl::after { display:none; }

/* HUD */
#hud { position:absolute; left:0; right:0; top:0; height:78px; z-index:40; display:flex; align-items:center; gap:30px; padding:0 40px; pointer-events:none; transition:opacity .6s; }
#hud.off { opacity:0; }
.h-t { font-family:var(--f-sig); font-weight:700; font-size:17px; letter-spacing:.06em; white-space:nowrap; }
.h-t b { color:var(--red); font-weight:700; }
.prog { flex:1; display:flex; gap:8px; }
.seg { flex:1; }
.seg i { display:block; height:4px; background:var(--line); position:relative; overflow:hidden; }
.seg i::after { content:''; position:absolute; inset:0; width:var(--p,0%); background:currentColor; transition:width .6s; }
.seg span { display:block; margin-top:8px; font-size:13px; letter-spacing:.14em; color:var(--dim); white-space:nowrap; }
.seg.cur span { color:var(--red); } .seg.cur i::after { background:var(--red); }
.calm .seg.cur span { color:var(--cy); } .calm .seg.cur i::after { background:var(--cy); }
.seg small { margin-left:8px; opacity:.7; display:none; } .seg.cur small { display:inline; }
.clock { font-family:var(--f-sig); font-size:24px; width:96px; text-align:right; }
.clock.late { color:var(--red); }
.h-snd { font-size:13px; letter-spacing:.14em; color:var(--dim); width:140px; text-align:right; }
.h-snd.off { color:var(--red); }

/* countdown */
.cd { position:absolute; width:150px; height:150px; cursor:pointer; z-index:20; }
.cd svg { width:100%; height:100%; transform:rotate(-90deg); }
.cd circle { fill:none; }
.cd .bg { stroke:var(--line); stroke-width:3; } .cd .fg { stroke:var(--red); stroke-width:5; stroke-dasharray:100; stroke-dashoffset:calc(100 - var(--f,1)*100); transition:stroke-dashoffset .1s linear; }
.cd b { position:absolute; inset:0; display:grid; place-items:center; font-family:var(--f-sig); font-weight:700; font-size:54px; }
.cd small { position:absolute; left:-60px; right:-60px; top:100%; margin-top:10px; text-align:center; font-size:13px; letter-spacing:.14em; color:var(--dim); }
.cd.run small { visibility:hidden; }
.cd.low b { color:var(--red); animation:blink .5s infinite; }
.cd.end b { color:var(--red); }
.rv .cd { display:none; }

/* channel-switch wipe between sections */
#wipe { position:absolute; inset:0; z-index:70; pointer-events:none; opacity:0; background:repeating-linear-gradient(0deg, rgba(255,255,255,.18) 0 2px, rgba(0,0,0,.6) 2px 5px), #111; }
#wipe.on { animation:wipe .55s steps(6) both; }
@keyframes wipe { 0% { opacity:0; transform:scaleY(.02); } 20% { opacity:1; transform:scaleY(1); } 60% { opacity:.9; background-position:0 40px; } 100% { opacity:0; transform:scaleY(1); } }
.flash { position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; z-index:72; animation:fl 1.1s both; }
.flash span { font-family:var(--f-sig); font-weight:900; font-size:150px; color:var(--red); letter-spacing:-.02em; }
@keyframes fl { 0% { opacity:0; transform:scale(1.3); } 12%,70% { opacity:1; transform:scale(1); } 100% { opacity:0; } }

/* ===== 0 · INTRO ===== */
.intro { display:flex; flex-direction:column; justify-content:center; padding:0 150px; background:radial-gradient(ellipse at 50% 60%, rgba(8,8,11,.2), rgba(8,8,11,.92) 70%); }
.intro .lbl { margin-bottom:34px; }
.t-big { margin:0; font-family:var(--f-sig); font-weight:900; font-size:250px; line-height:.86; letter-spacing:-.04em; }
.t-out { display:block; margin-top:18px; font-family:var(--f-sig); font-weight:900; font-size:118px; line-height:1; letter-spacing:-.02em; color:transparent; -webkit-text-stroke:2px var(--ink); }
.t-out b { -webkit-text-stroke:2px var(--red); font-weight:900; }
.intro .voice { margin-top:46px; font-size:58px; line-height:1.15; max-width:1300px; }
.go { margin-top:56px; align-self:flex-start; background:none; border:2px solid var(--ink); color:var(--ink); font-size:22px; letter-spacing:.2em; padding:20px 30px; cursor:pointer; display:flex; gap:18px; align-items:center; }
.go:hover { background:var(--ink); color:var(--bg); }
.go i { width:14px; height:14px; border-radius:50%; background:var(--red); animation:blink 1s infinite; }
.tools { position:absolute; right:60px; bottom:50px; display:flex; gap:10px; }
.tool { background:none; border:1px solid var(--line); color:var(--dim); font-size:14px; letter-spacing:.12em; padding:10px 14px; cursor:pointer; }
.tool:hover { color:var(--ink); border-color:var(--ink); }

/* ===== 1 · LISTEN ===== */
.listen h2 { position:absolute; left:120px; right:120px; top:170px; margin:0; font-family:var(--f-sig); font-weight:900; font-size:118px; line-height:.95; letter-spacing:-.03em; }
.slots { position:absolute; left:120px; right:120px; top:560px; display:grid; grid-template-columns:repeat(6,1fr); gap:18px; }
.slot { height:250px; border:1px solid var(--line); background:rgba(8,8,11,.7); position:relative; overflow:hidden; perspective:800px; }
.slot .q { position:absolute; inset:0; display:grid; place-items:center; font-family:var(--f-sig); font-weight:900; font-size:150px; color:var(--line); animation:blink 1.3s infinite; }
.slot:nth-child(2) .q { animation-delay:.3s; } .slot:nth-child(3) .q { animation-delay:.6s; } .slot:nth-child(4) .q { animation-delay:.9s; } .slot:nth-child(5) .q { animation-delay:.45s; } .slot:nth-child(6) .q { animation-delay:.75s; }
.slot .meter { position:absolute; left:20px; right:20px; bottom:20px; height:44px; display:flex; gap:4px; align-items:flex-end; }
.slot .meter i { flex:1; background:var(--red); opacity:.75; animation:lev var(--sp,.4s) ease-in-out infinite alternate; transform-origin:bottom; }
@keyframes lev { from { transform:scaleY(.12); } to { transform:scaleY(1); } }
.slot .a { position:absolute; inset:0; padding:22px 20px; display:flex; flex-direction:column; justify-content:space-between; animation:flip .7s cubic-bezier(.2,.8,.2,1) both; animation-delay:var(--dl,0s); background:var(--ink); color:var(--bg); }
@keyframes flip { from { transform:rotateX(90deg); opacity:0; } }
.slot .a small { font-size:16px; letter-spacing:.2em; }
.slot .a b { font-family:var(--f-sig); font-weight:900; font-size:21px; letter-spacing:-.03em; line-height:1; letter-spacing:-.02em; }
.listen .cd { right:120px; top:330px; }
.listen .sub { position:absolute; left:120px; right:120px; top:880px; font-size:50px; line-height:1.2; animation:up .8s 1.6s both; }
.listen .sub b { font-family:var(--f-sig); font-style:normal; font-weight:700; font-size:34px; color:var(--red); letter-spacing:.02em; display:block; margin-bottom:10px; }
.listen .hint { position:absolute; left:120px; top:880px; font-size:22px; letter-spacing:.2em; color:var(--dim); }

/* ===== votes (shared) ===== */
.opts { display:grid; gap:20px; }
.opt { position:relative; border:1px solid var(--line); background:rgba(8,8,11,.78); padding:26px 28px; cursor:pointer; transition:opacity .5s, transform .5s, background .4s, border-color .4s; display:flex; gap:24px; align-items:center; }
.opt:hover { border-color:var(--ink); }
.opt em { font-style:normal; font-family:var(--f-sig); font-weight:900; font-size:64px; line-height:1; color:var(--red); width:62px; flex:none; }
.opt span { font-family:var(--f-sig); font-weight:700; font-size:36px; line-height:1.08; letter-spacing:-.01em; }
.opt .pick { position:absolute; right:14px; top:12px; font-size:13px; letter-spacing:.2em; background:var(--amb); color:var(--bg); padding:3px 8px; display:none; }
.opt.picked .pick { display:block; }
.opt.picked { border-color:var(--amb); }
.rv .opt.no { opacity:.18; transform:scale(.97); }
.rv .opt.ok { background:var(--red); border-color:var(--red); transform:scale(1.03); }
.rv .opt.ok em { color:var(--ink); }
.qh { margin:0; font-family:var(--f-sig); font-weight:900; font-size:76px; line-height:1; letter-spacing:-.03em; }

/* ===== 2 · SOURCE GAME ===== */
.game .lbl { position:absolute; left:120px; top:120px; }
.game .qh { position:absolute; left:120px; right:420px; top:170px; }
.game .cd { right:140px; top:150px; }
.scene { position:absolute; left:0; right:0; top:370px; height:330px; }
.scene svg { width:100%; height:100%; overflow:visible; }
.scene .el { transition:opacity .6s; }
.rv .scene .el.x { opacity:.12; }
.scene .car { animation:drive var(--d,3s) linear infinite; animation-delay:var(--dl,0s); }
@keyframes drive { from { transform:translateX(-300px); } to { transform:translateX(2200px); } }
.scene .car.r { animation-name:driveR; }
@keyframes driveR { from { transform:translateX(2200px); } to { transform:translateX(-300px); } }
.rv .scene .car rect { fill:var(--red); }
.scene .bird { animation:flap 1.2s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center; }
@keyframes flap { to { transform:scaleY(.4); } }
.scene .wind { stroke-dasharray:40 400; animation:windA 3.5s linear infinite; }
@keyframes windA { to { stroke-dashoffset:-440; } }
.game .opts { position:absolute; left:120px; right:120px; top:740px; grid-template-columns:repeat(4,1fr); }
.game .opt { height:200px; flex-direction:column; align-items:flex-start; justify-content:space-between; }
.verdict { position:absolute; left:120px; right:120px; bottom:40px; font-size:20px; animation:up .6s .4s both; }
.verdict b { color:var(--ink); font-weight:600; }

/* ===== 3 · MIXER ===== */
.mixer .lbl { position:absolute; left:120px; top:120px; }
.mixer .qh { position:absolute; left:120px; top:168px; font-size:92px; }
.mixer .qh small { display:block; margin-top:16px; font-family:var(--f-voice); font-style:italic; font-weight:400; font-size:46px; letter-spacing:0; color:var(--dim); }
.desk { position:absolute; left:120px; right:120px; top:420px; height:500px; display:grid; grid-template-columns:repeat(6,1fr); gap:18px; }
.ch { position:relative; border:1px solid var(--line); background:rgba(8,8,11,.8); cursor:pointer; padding:22px; display:flex; flex-direction:column; transition:border-color .3s, background .3s; animation:up .7s both; }
.ch:nth-child(2) { animation-delay:.1s; } .ch:nth-child(3) { animation-delay:.2s; } .ch:nth-child(4) { animation-delay:.3s; } .ch:nth-child(5) { animation-delay:.4s; } .ch:nth-child(6) { animation-delay:.5s; }
.ch:hover, .ch.on { border-color:var(--red); }
.ch.on { background:rgba(255,58,46,.12); }
.ch .no { font-size:14px; letter-spacing:.2em; color:var(--dim); }
.ch .bars { flex:1; display:flex; gap:6px; align-items:flex-end; margin:18px 0; }
.ch .bars i { flex:1; height:100%; background:linear-gradient(to top, var(--ink) 0 60%, var(--amb) 60% 82%, var(--red) 82%); animation:lev var(--sp,.5s) ease-in-out infinite alternate; transform-origin:bottom; opacity:.85; }
.ch.main .bars i { animation-name:levHi; }
@keyframes levHi { from { transform:scaleY(.45); } to { transform:scaleY(1); } }
.ch .bars i { --lo:.08; }
.ch b { font-family:var(--f-sig); font-weight:700; font-size:26px; line-height:1.05; }
.ch .pl { margin-top:12px; font-size:15px; letter-spacing:.16em; color:var(--dim); }
.ch.on .pl { color:var(--red); }
.ch .tag { position:absolute; right:-1px; top:-1px; background:var(--red); color:var(--ink); font-size:13px; letter-spacing:.16em; padding:5px 10px; }
.mixer .src { position:absolute; left:120px; right:120px; bottom:44px; }

/* ===== 4 · PEOPLE ===== */
.people .lbl { position:absolute; left:120px; top:120px; }
.people .qh { position:absolute; left:120px; right:420px; top:168px; font-size:92px; }
.people .cd { right:140px; top:150px; }
.ppl { position:absolute; left:120px; right:120px; top:400px; height:520px; display:grid; grid-template-columns:repeat(3,1fr); gap:26px; }
.ppl .opt { flex-direction:column; align-items:stretch; padding:0; gap:0; overflow:hidden; }
.ppl .opt .top { display:flex; justify-content:space-between; align-items:baseline; padding:20px 24px 0; }
.ppl .opt .top em { font-size:46px; width:auto; }
.ppl .opt .tm { font-family:var(--f-sig); font-size:36px; font-weight:400; color:var(--dim); }
.ppl .art { height:230px; padding:6px 24px; color:var(--ink); }
.ppl .art svg { width:100%; height:100%; }
.ppl .who { padding:0 24px; font-family:var(--f-sig); font-weight:700; font-size:32px; line-height:1.05; }
.ppl .thought { padding:14px 24px 0; font-family:var(--f-voice); font-style:italic; font-size:34px; line-height:1.15; color:var(--dim); }
.ppl .hit { margin:auto 24px 24px; padding-top:14px; border-top:1px solid var(--line); font-size:18px; letter-spacing:.16em; color:var(--red); animation:up .5s .3s both; }
.rv .ppl .opt { opacity:1; transform:none; background:rgba(8,8,11,.85); border-color:var(--line); }
.rv .ppl .opt.picked { border-color:var(--amb); }
.ppl .zz { animation:blink 1.6s infinite; }
.people .all { position:absolute; left:120px; right:120px; top:168px; margin:0; font-family:var(--f-sig); font-weight:900; font-size:80px; line-height:1; letter-spacing:-.03em; animation:up .6s both; }
.people .all span { color:var(--red); }
.people .src { position:absolute; left:120px; right:120px; bottom:44px; }
.people .src .voice { font-size:30px; color:var(--ink); }

/* ===== 5 · CROWD ===== */
.crowd .lbl { position:absolute; left:120px; top:120px; }
.crowd .qh { position:absolute; left:120px; right:120px; top:168px; font-size:74px; }
#dots { position:absolute; left:160px; top:340px; width:1600px; height:650px; }
.crowd .ask { position:absolute; left:120px; top:996px; font-family:var(--f-voice); font-style:italic; font-size:44px; color:var(--dim); }
.big-n { position:absolute; left:120px; top:158px; font-family:var(--f-sig); font-weight:900; font-size:118px; line-height:1; letter-spacing:-.04em; }
.big-n small { display:block; font-family:var(--f-mono); font-weight:400; font-size:22px; letter-spacing:.2em; margin-top:4px; color:var(--dim); }
.night-n { position:absolute; right:120px; top:180px; text-align:right; font-family:var(--f-sig); font-weight:700; font-size:64px; color:var(--red); opacity:0; transition:opacity .8s; }
.night-n small { display:block; font-family:var(--f-mono); font-weight:400; font-size:22px; letter-spacing:.2em; color:var(--dim); margin-top:8px; }
.night-n.on { opacity:1; }
.crowd .key { position:absolute; left:160px; top:1004px; font-size:18px; letter-spacing:.14em; color:var(--dim); }
.crowd .key i { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--ink); margin-right:10px; }
.crowd .src { position:absolute; left:560px; right:120px; top:996px; font-size:15px; }

/* ===== 6 · BUCHAREST MAP ===== */
.map .lbl { position:absolute; left:120px; top:120px; }
.mapbox { position:absolute; left:50px; top:160px; width:1140px; height:860px; }
.mapbox > svg { width:100%; height:100%; overflow:visible; }
#lmap { position:absolute; inset:0; background:#0d0d10; border:1px solid var(--line); }
#lmap .leaflet-tile-pane { filter:brightness(1.25) contrast(1.05); }
.m-tip { background:rgba(8,8,11,.85); border:0; border-radius:0; box-shadow:none; color:#f1efe9; font-family:var(--f-mono); font-size:14px; padding:2px 6px; letter-spacing:.02em; }
.m-tip.c { color:#39e5d0; background:rgba(8,8,11,.6); }
.m-tip::before { display:none; }
.leaflet-container .m-road, .leaflet-container .m-hit, .leaflet-container .m-park { cursor:pointer; }
.m-glow { animation:pulse 2.4s ease-in-out infinite; }
.m-info { position:absolute; left:20px; top:20px; z-index:500; width:440px; background:rgba(8,8,11,.92); border-left:4px solid var(--red); padding:18px 22px; }
.m-info small { display:block; font-size:14px; letter-spacing:.18em; color:var(--red); }
.m-info small.c { color:var(--cy); }
.m-info b { display:block; margin-top:6px; font-family:var(--f-sig); font-size:30px; line-height:1.1; }
.m-info p { margin:8px 0 0; font-size:18px; line-height:1.4; color:var(--dim); }
.m-info .snd { display:block; margin-top:10px; font-size:15px; color:var(--amb); }
.m-legend { position:absolute; left:20px; bottom:46px; z-index:500; display:flex; gap:10px; }
.m-legend button { background:rgba(8,8,11,.92); border:1px solid var(--line); color:var(--ink); font-size:16px; letter-spacing:.14em; padding:12px 16px; cursor:pointer; display:flex; align-items:center; gap:10px; }
.m-legend button.on, .m-legend button:hover { border-color:var(--ink); }
.m-legend i { width:26px; height:6px; display:inline-block; }
.lg-r { background:var(--red); } .lg-c { background:var(--cy); }
.m-attr { position:absolute; right:8px; bottom:6px; z-index:500; font-size:12px; color:rgba(241,239,233,.55); }

.mapbox .st { cursor:pointer; }
.mapbox .st .glow { stroke:var(--red); stroke-width:16; opacity:.25; filter:blur(6px); animation:pulse 2.4s ease-in-out infinite; }
.mapbox .st .core { stroke:var(--red); stroke-width:5; stroke-linecap:round; }
.mapbox .st:hover .core, .mapbox .st.on .core { stroke:var(--ink); }
.mapbox .st text { fill:var(--ink); font-family:var(--f-mono); font-size:17px; letter-spacing:.04em; }
.mapbox .st.night .core { stroke-dasharray:2 10; }
@keyframes pulse { 50% { opacity:.6; } }
.mapbox .qz circle { fill:rgba(57,229,208,.12); stroke:var(--cy); stroke-width:2; stroke-dasharray:4 6; }
.mapbox .qz text { fill:var(--cy); font-family:var(--f-mono); font-size:15px; }
.mapbox .ring { fill:none; stroke:var(--line); stroke-width:2; stroke-dasharray:3 9; }
.mapbox .river { fill:none; stroke:#2f6fd0; stroke-width:6; opacity:.7; }
.mapbox .city { fill:rgba(241,239,233,.035); stroke:var(--line); stroke-width:1.5; }

<script>
{
'use strict';
const $ = (s, r = document) => r.querySelector(s);

const gl = (t) => `<span class="gl" data-t="${esc(t)}">${esc(t)}</span>`;

/* =========================================================================
   SOUND ENGINE — everything synthesized live, so nothing has to download.
   layers → scene gain (faded at the end) → analyser (drives visuals) → master (mute) → out
   If audio fails, the whole presentation still runs; visuals fall back to simulated levels.
   ========================================================================= */
const A = { ctx: null, ok: false, paused: false };
const L = {};
function aInit() {
  if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return A.ok; }
  try {
    const C = window.AudioContext || window.webkitAudioContext; A.ctx = new C();
    const c = A.ctx;
    A.scene = c.createGain(); A.an = c.createAnalyser(); A.an.fftSize = 1024; A.an.smoothingTimeConstant = .75;
    A.master = c.createGain(); A.master.gain.value = S.muted ? 0 : .85 * S.vol;
    A.comp = c.createDynamicsCompressor(); A.comp.threshold.value = -16; A.comp.ratio.value = 4;
    A.scene.connect(A.an); A.an.connect(A.master); A.master.connect(A.comp); A.comp.connect(c.destination);
    const mk = (brown) => { const b = c.createBuffer(1, c.sampleRate * 6, c.sampleRate), d = b.getChannelData(0); let last = 0; for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; if (brown) { last = (last + .02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w; } return b; };
    A.white = mk(false); A.brown = mk(true); A.ok = true;
    setTimeout(() => { Object.keys(RAW).forEach(decodeOne); recStatus(); }, 0);

}
const now = () => A.ctx.currentTime;
function loopSrc(buf, off) { const s = A.ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(now(), off == null ? Math.random() * 3 : off); return s; }
function env(p, t, a, peak, hold, rel) { p.setValueAtTime(.0001, t); p.exponentialRampToValueAtTime(peak, t + a); p.setValueAtTime(peak, t + a + hold); p.exponentialRampToValueAtTime(.0001, t + a + hold + rel); }

  const g = c.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.45 + Math.random() * .4, t + d * .5); g.gain.exponentialRampToValueAtTime(.0001, t + d);

function honk(out, n) {

  for (let k = 0; k < n; k++) {
    const t = now() + k * .3, d = k === n - 1 ? .2 + Math.random() * .5 : .12;
    const g = c.createGain(), lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2300; g.connect(lp);

function bell(out, t) { const c = A.ctx; [1, 2.76, 5.4, 8.93].forEach((m, i) => { const o = c.createOscillator(); o.frequency.value = 1420 * m; const g = c.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.2 / (i + 1), t + .004); g.gain.exponentialRampToValueAtTime(.0001, t + 1.5 / (i * .7 + 1)); o.connect(g).connect(out); o.start(t); o.stop(t + 1.7); }); }

  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = .8; const g = c.createGain(); g.gain.setValueAtTime(.0001, t);

function grind(out) { const c = A.ctx, t = now(), d = 1.6 + Math.random() * 1.5, s = c.createBufferSource(); s.buffer = A.white; s.loop = true; const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 4; bp.frequency.setValueAtTime(2600, t); bp.frequency.linearRampToValueAtTime(4200, t + d); const g = c.createGain(); env(g.gain, t, .2, .5, d - .4, .2); s.connect(bp).connect(g).connect(out); s.start(t); s.stop(t + d + .1); }

  $$('[data-lv]', o).forEach((r) => r.oninput = () => { const k = r.dataset.lv; S.snd[k] = +r.value / 100; const row = r.closest('.sp-row'); row.classList.toggle('off', S.snd[k] === 0); $('.sp-t', row).textContent = S.snd[k] > 0 ? 'ON' : 'OFF'; apply(); });
  $$('[data-vol]', o).forEach((r) => r.oninput = () => { S.vol = +r.value / 100; $('.sp-v', o).textContent = r.value + '%'; save(); if (A.ctx && !S.muted) A.master.gain.setTargetAtTime(.85 * S.vol, now(), .02); });
  $$('[data-test]', o).forEach((b) => b.onclick = (e) => { e.stopPropagation(); solo(b.dataset.test); });
  $$('[data-sp]', o).forEach((b) => b.onclick = (e) => { e.stopPropagation(); const a = b.dataset.sp;
    if (a === 'close') return sndPanel(false);
    if (a === 'all' || a === 'reset') SND_KEYS.forEach(([k]) => (S.snd[k] = 1)); if (a === 'none') SND_KEYS.forEach(([k]) => (S.snd[k] = 0)); if (a === 'reset') S.vol = 1;
    if (A.ctx && !S.muted) A.master.gain.setTargetAtTime(.85 * S.vol, now(), .02); apply(); sndPanel(true); });
}
$('#sndp').addEventListener('click', (e) => e.stopPropagation());
$('#sndp').addEventListener('pointerdown', (e) => e.stopPropagation());
/* ---------- actions ---------- */
let resetArm = 0;
function act(a) {
  if (a === 'start') { aInit(); return go(1); }
  if (a === 'mute') { aInit(); setMute(!S.muted); toast(S.muted ? 'Muted' : 'Sound on'); const t = $('[data-act="mute"]'); if (t) t.textContent = S.muted ? 'SOUND: OFF' : 'SOUND: ON'; return; }
  if (a === 'fs') { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {} return; }
  if (a === 'help') return pinBar(true);
  if (a === 'src') return sources();
  if (a === 'snds') return sndPanel();
  if (a === 'replay') { S.t0 = 0; S.picks = {}; save(); return go(0); }
}
function togglePause() {
  if (!aInit()) return toast('Audio not available');
  A.paused = !A.paused;
  if (A.paused) { Object.keys(L).forEach(stopLayer); toast('Sound paused (P)'); } else { toast('Sound back on'); soundNow(); }
  $('#c-sound').textContent = A.paused ? 'Sound ▶ (P)' : 'Sound ❚❚ (P)'; hud();
}
function pinBar(v) { const c = $('#ctl'); const on = v == null ? !c.classList.contains('pin') : v; c.classList.toggle('pin', on); $('#c-pin').textContent = on ? 'Unpin bar (C)' : 'Pin bar (C)'; }
$('#ctl').addEventListener('click', (e) => {
  const b = e.target.closest('[data-c]'); if (!b) return; aInit();
  ({ back, reveal, next: advance, timer: tToggle, treset: tReset, mute: () => act('mute'), snds: () => sndPanel(), sound: togglePause, src: () => sources(), fs: () => act('fs'), pin: () => pinBar(),
    reset: () => { if (Date.now() - resetArm > 3000) { resetArm = Date.now(); b.textContent = 'Click again: restart'; setTimeout(() => (b.textContent = 'Restart'), 3000); return; } b.textContent = 'Restart'; act('replay'); }
  }[b.dataset.c] || (() => {}))();
});
document.addEventListener('click', (e) => { if (e.target.closest && e.target.closest('button')) setTimeout(() => { const a = document.activeElement; if (a && a.tagName === 'BUTTON') a.blur(); }, 0); });
$('#srcs').addEventListener('click', () => sources(false));
let hideT = 0;
document.addEventListener('mousemove', (e) => { const c = $('#ctl'); if (e.clientY > window.innerHeight - 160) { c.classList.add('show'); clearTimeout(hideT); hideT = setTimeout(() => c.classList.remove('show'), 2500); } });
// the first click/key anywhere unlocks audio (browsers require a gesture) and starts this screen's sound
let unlocked = false;
const unlock = () => { if (unlocked) return; unlocked = true; if (aInit()) { setMute(S.muted); soundNow(); } hud(); };
document.addEventListener('pointerdown', unlock);
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target && e.target.tagName === 'INPUT') return;
  const k = e.key; unlock();
  if (srcOn && (k === 'Escape' || k === 's' || k === 'S')) { e.preventDefault(); return sources(false); }
  if (k === 'n' || k === 'N') { e.preventDefault(); return sndPanel(); }
  if (sndOn && k === 'Escape') return sndPanel(false);
  if (k === ' ' || k === 'PageDown' || k === 'ArrowRight') { e.preventDefault(); advance(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); back(); }
  else if (k === 'Enter') { e.preventDefault(); reveal(); }
  else if (k === 'f' || k === 'F') act('fs');
  else if (k === 'm' || k === 'M') act('mute');
  else if (k === 'p' || k === 'P') togglePause();
  else if (k === 't' || k === 'T') tToggle();
  else if (k === 'r' || k === 'R') tReset();
  else if (k === 's' || k === 'S') sources();
  else if (k === 'c' || k === 'C') pinBar();
  else if (k === 'Home') go(0);
  else if (/^[1-4]$/.test(k)) pick(+k - 1);
});

/* ---------- scale stage to the screen ---------- */
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();
$('#c-mute').textContent = S.muted ? 'Unmute (M)' : 'Mute (M)';
tSet(step().timer || 0); render(); preload(); recStatus();
// the map library loads in the background; until it arrives (or if offline) the map slide uses the built-in schematic
(() => { const c = document.createElement('link'); c.rel = 'stylesheet'; c.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(c);
  const j = document.createElement('script'); j.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; j.async = true; j.onload = () => { if (step().k === 'map') { first = false; render(); } }; document.head.appendChild(j); })();
window.__N = { S: () => S, go, advance, reveal, back, steps: STEPS.length, rec: () => Object.fromEntries(Object.keys(REC).map((k) => [k, BUF[k] ? 'ok' : RAW[k] ? 'downloaded' : String(BUF[k])])), layers: () => Object.keys(L).map((n) => n + (L[n].rec ? ':rec' : ':synth')) };
}
